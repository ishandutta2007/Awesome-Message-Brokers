<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid {
        stroke: #334155;
        stroke-opacity: 0.18;
        stroke-width: 1;
      }
      .stream-line {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 2;
        stroke-dasharray: 8, 14;
        animation: streamFlow 12s linear infinite;
        opacity: 0.45;
      }
      .stream-line-fast {
        fill: none;
        stroke: #a855f7;
        stroke-width: 2.2;
        stroke-dasharray: 10, 16;
        animation: streamFlowRev 9s linear infinite;
        opacity: 0.55;
      }
      .stream-line-accent {
        fill: none;
        stroke: #34d399;
        stroke-width: 1.8;
        stroke-dasharray: 6, 12;
        animation: streamFlow 14s linear infinite;
        opacity: 0.4;
      }
      .pulsing-node {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      .pulse-delay-1 {
        animation: pulseNode 3.5s ease-in-out 0.8s infinite alternate;
      }
      .pulse-delay-2 {
        animation: pulseNode 2.8s ease-in-out 1.6s infinite alternate;
      }
      .packet-dot {
        fill: #38bdf8;
        animation: packetMove1 4s ease-in-out infinite;
      }
      .packet-dot-2 {
        fill: #c084fc;
        animation: packetMove2 5s ease-in-out infinite;
      }
      .badge-pill {
        fill: #1e293b;
        stroke: #475569;
        stroke-width: 1;
        rx: 14;
        transition: all 0.3s ease;
      }
      .badge-text {
        fill: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
      }

      @keyframes streamFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -200; }
      }
      @keyframes streamFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulseNode {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes packetMove1 {
        0% { transform: translate(0, 0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(240px, 0); opacity: 0; }
      }
      @keyframes packetMove2 {
        0% { transform: translate(0, 0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(-220px, 0); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="320" fill="url(#bgGrad)" />

  <!-- Background Architectural Grid -->
  <g class="bg-grid">
    <line x1="0" y1="40" x2="960" y2="40" />
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="280" x2="960" y2="280" />

    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="640" y1="0" x2="640" y2="320" />
    <line x1="760" y1="0" x2="760" y2="320" />
    <line x1="880" y1="0" x2="880" y2="320" />
  </g>

  <!-- Background Event Mesh Flow Lines (Behind Foreground) -->
  <path d="M 40 60 C 200 60, 240 140, 480 140 C 720 140, 760 60, 920 60" class="stream-line" />
  <path d="M 40 180 C 220 180, 260 90, 480 90 C 700 90, 740 180, 920 180" class="stream-line-fast" />
  <path d="M 40 260 C 240 260, 300 210, 480 210 C 660 210, 720 260, 920 260" class="stream-line-accent" />

  <!-- Peripheral Broker/Node Indicators -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="16" fill="#0284c7" opacity="0.2" class="pulsing-node" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="600">PRODUCER</text>
  </g>

  <g transform="translate(60, 260)">
    <circle cx="0" cy="0" r="16" fill="#059669" opacity="0.2" class="pulse-delay-1" />
    <circle cx="0" cy="0" r="6" fill="#34d399" filter="url(#softGlow)" />
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="600">PUBLISHER</text>
  </g>

  <g transform="translate(900, 60)">
    <circle cx="0" cy="0" r="16" fill="#7c3aed" opacity="0.2" class="pulse-delay-2" />
    <circle cx="0" cy="0" r="6" fill="#c084fc" filter="url(#softGlow)" />
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="600">CONSUMER</text>
  </g>

  <g transform="translate(900, 260)">
    <circle cx="0" cy="0" r="16" fill="#0284c7" opacity="0.2" class="pulsing-node" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" font-weight="600">SUBSCRIBER</text>
  </g>

  <!-- Foreground Glassmorphic Hero Card -->
  <g transform="translate(140, 36)">
    <!-- Card Backplate (Guarantees foreground clarity and prevents any overlap/obscurity) -->
    <rect width="680" height="248" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="680" height="248" rx="20" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4" />

    <!-- Top Accent Bar -->
    <rect x="240" y="0" width="200" height="3" rx="1.5" fill="url(#primaryGrad)" />

    <!-- Category Pill -->
    <rect x="250" y="22" width="180" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="340" y="38" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">DISTRIBUTED MESSAGING</text>

    <!-- Main Title -->
    <text x="340" y="88" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      AWESOME MESSAGE BROKERS
    </text>

    <!-- Subtitle -->
    <text x="340" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" text-anchor="middle">
      Curated Ecosystem of Cloud SaaS Platforms &amp; Open-Source Queuing Engines
    </text>

    <!-- Dynamic Protocol Badges / Pills in Foreground Card -->
    <g transform="translate(42, 154)">
      <!-- Pill 1: Apache Kafka -->
      <g transform="translate(0, 0)">
        <rect width="92" height="28" class="badge-pill" />
        <text x="46" y="18" class="badge-text" text-anchor="middle">⚡ Kafka</text>
      </g>
      <!-- Pill 2: RabbitMQ -->
      <g transform="translate(100, 0)">
        <rect width="102" height="28" class="badge-pill" />
        <text x="51" y="18" class="badge-text" text-anchor="middle">🐰 RabbitMQ</text>
      </g>
      <!-- Pill 3: NATS JetStream -->
      <g transform="translate(210, 0)">
        <rect width="128" height="28" class="badge-pill" />
        <text x="64" y="18" class="badge-text" text-anchor="middle">🚀 NATS JetStream</text>
      </g>
      <!-- Pill 4: Apache Pulsar -->
      <g transform="translate(346, 0)">
        <rect width="98" height="28" class="badge-pill" />
        <text x="49" y="18" class="badge-text" text-anchor="middle">🌊 Pulsar</text>
      </g>
      <!-- Pill 5: EMQX / MQTT -->
      <g transform="translate(452, 0)">
        <rect width="144" height="28" class="badge-pill" />
        <text x="72" y="18" class="badge-text" text-anchor="middle">📡 EMQX (MQTT 5.0)</text>
      </g>
    </g>

    <!-- Micro-Specs Subline -->
    <g transform="translate(0, 216)">
      <text x="340" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
        AMQP 1.0 • KRaft Architecture • High-Throughput Pub/Sub • Sub-Millisecond Latency • Cloud-Native
      </text>
    </g>
  </g>
</svg>
